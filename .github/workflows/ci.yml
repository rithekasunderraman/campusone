name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, import, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names)
        run: ruff check app scripts tests --select E9,F63,F7,F82
      - name: Import check
        run: python -c "import app.main"
        env:
          AUTO_SEED: "false"
      - name: Tests (throwaway SQLite database built from the migrations)
        run: pytest -q

  frontend:
    name: Frontend (type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
