# Render Blueprint: the whole deployment, reproducible from this repository.
#
#   campusone-db   managed PostgreSQL 16
#   campusone-api  FastAPI backend (Python web service)
#   campusone-web  React/Vite frontend (static site on Render's CDN)
#
# All three live in one region so the API talks to the database over Render's
# private network. Secrets are never stored here: JWT_SECRET is generated by
# Render, DATABASE_URL is injected from the database, and the values marked
# "sync: false" are typed into the Render dashboard (see docs/DEPLOYMENT.md).

databases:
  - name: campusone-db
    databaseName: campusone
    user: campusone
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: campusone-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Bring the schema to the latest migration, then serve. Never seeds in production.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: database
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: CORS_ORIGINS        # the frontend's public URL, e.g. https://campusone-web.onrender.com
        sync: false
      - key: ANTHROPIC_API_KEY   # optional; leave empty to run on the deterministic engine
        sync: false

  - type: web
    name: campusone-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite            # client-side routing: every path serves the app
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE_URL   # the backend's public URL + /api, e.g. https://campusone-api.onrender.com/api
        sync: false
